[project]
name = "parclepilot-render"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arkit003", email = "arkit312003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
parclepilot-render = "parclepilot_render:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
